<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DIY INDEX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #0a0a0f; color: #e8e8f0; font-family: 'IBM Plex Mono', monospace; }
      input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
      input[type=range]::-webkit-slider-runnable-track { height: 4px; background: #2a2a3a; border-radius: 2px; }
      input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #7c6fff; margin-top: -6px; }
      input[type=range]::-moz-range-track { height: 4px; background: #2a2a3a; border-radius: 2px; }
      input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #7c6fff; border: none; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #12121a; }
      ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
